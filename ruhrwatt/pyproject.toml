[project]
name = "ruhrwatt"
version = "0.1.0"
description = "Small-big-data energy and logistics copilot for NRW industry (PySpark, Rust, local RAG)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.7",
    "holidays>=0.60",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "polars>=1.20",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "xgboost>=2.1",
]

[project.scripts]
ruhrwatt = "ruhrwatt.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=4",
    "pyarrow>=17",  # tests and the benchmark read Parquet back
    "tzdata>=2024.1; sys_platform == 'win32'",  # zoneinfo data for the DST tests on Windows
]
# Spark needs Java 17 or 21 (`java -version`).
spark = [
    "pyspark>=4.0",
    "pyarrow>=17",
]
# Local RAG assistant: the LLM and embeddings run in Ollama, the vector store is LanceDB.
rag = [
    "lancedb>=0.15",
]
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
]

# Mixed Python/Rust project: maturin builds ruhrwatt._core from crates/ruhrwatt-core.
# Needs a Rust toolchain (https://rustup.rs).
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "ruhrwatt._core"
manifest-path = "crates/ruhrwatt-core/Cargo.toml"
features = ["extension-module"]
profile = "release"

[tool.uv]
# Plain `uv sync` installs these groups too (otherwise it would remove Jupyter again).
default-groups = ["dev", "notebook", "spark", "rag"]
# Rebuild the extension when Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["spark: needs Java and starts a local Spark session (deselect with -m 'not spark')"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
