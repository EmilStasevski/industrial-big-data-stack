[package]
name = "ruhrwatt-core"
version = "0.1.0"
edition = "2024"
description = "Fast SMARD parsing, validation and Parquet writing for Ruhrwatt (PyO3)."
publish = false
rust-version = "1.85"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
# Enabled by maturin only; plain `cargo test` must link libpython instead.
extension-module = ["pyo3/extension-module"]

[dependencies]
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
pyo3 = { version = "0.29.3", features = ["abi3-py311"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.21"
