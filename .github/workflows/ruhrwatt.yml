name: ruhrwatt

on:
  push:
    branches: [main]
    paths: ["ruhrwatt/**", ".github/workflows/ruhrwatt.yml"]
  pull_request:
    paths: ["ruhrwatt/**", ".github/workflows/ruhrwatt.yml"]

concurrency:
  group: ruhrwatt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The project lives in a subfolder of the repository
defaults:
  run:
    working-directory: ruhrwatt

jobs:
  python-rust:
    name: Python + Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruhrwatt
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ruhrwatt/uv.lock
      - name: Rust format and lint
        run: |
          cargo fmt --all --check
          cargo clippy -p ruhrwatt-core -- -D warnings
      - name: Install (builds the Rust extension with maturin)
        run: uv sync --frozen
      - name: Rust unit tests
        run: cargo test -p ruhrwatt-core
        env:
          PYO3_PYTHON: ${{ github.workspace }}/ruhrwatt/.venv/bin/python
      - name: Python lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Python tests (without Spark)
        run: uv run pytest -m "not spark"

  spark:
    name: Spark parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruhrwatt
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ruhrwatt/uv.lock
      - run: uv sync --frozen
      - name: Spark tests (Spark and Polars must agree)
        run: uv run pytest -m spark

  go:
    name: Go API
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ruhrwatt/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ruhrwatt/api/go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ruhrwatt-api .

  docker:
    name: Docker images
    needs: [python-rust, go]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Pipeline image
        uses: docker/build-push-action@v7
        with:
          context: ruhrwatt
          target: runtime
          tags: ruhrwatt:ci
          push: false
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,mode=max,scope=pipeline
      - name: API image
        uses: docker/build-push-action@v7
        with:
          context: ruhrwatt/api
          tags: ruhrwatt-api:ci
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Compose file is valid
        run: docker compose --profile batch --profile assistant --profile monitoring --profile spark config --quiet
